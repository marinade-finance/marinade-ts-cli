packages:
  - 'packages/*'
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  node-hid: true
  unrs-resolver: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - brace-expansion@1.1.12
  - brace-expansion@2.0.2
  - tmp@0.2.4
  - diff@4.0.4
  - js-yaml@3.14.2
  - js-yaml@4.1.1
  - bn.js@5.2.3
  - minimatch@3.1.3
  - minimatch@9.0.6
  - minimatch@9.0.7
  - minimatch@3.1.4
  - ajv@6.14.0
  - flatted@3.4.0
  - flatted@3.4.2
  - brace-expansion@1.1.13
  - brace-expansion@2.0.3
  - picomatch@2.3.2
  - picomatch@4.0.4
  - ws@8.20.1
  - uuid@11.1.1
  - tmp@0.2.6
  - ws@8.21.0
  - ws@7.5.11
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
overrides:
  '@babel/core@<=7.29.0': ^7.29.1
  '@babel/helpers@<7.26.10': '7.27.1'
  '@babel/runtime@<7.26.10': '7.27.1'
  ajv@<6.14.0: ^6.14.0
  'base-x@4.0.0': '4.0.1'
  'base-x@5.0.0': '5.0.1'
  'base-x@<3.0.11': '3.0.11'
  # bigint-buffer GHSA-3gc7-fjrx-p6mg: no patched release exists on npm (latest is 1.1.5),
  # so it cannot be overridden. Accepted exception — low risk: the toBigIntLE() overflow is
  # reached only via @solana/buffer-layout-utils decoding on-chain data in a CLI context.
  bn.js@>=5.0.0 <5.2.3: ^5.2.3
  brace-expansion@<1.1.13: ^1.1.13
  brace-expansion@>=1.0.0 <=1.1.11: ^1.1.12
  brace-expansion@>=2.0.0 <2.0.3: ^2.0.3
  brace-expansion@>=2.0.0 <=2.0.1: ^2.0.2
  diff@>=4.0.0 <4.0.4: ^4.0.4
  flatted@<3.4.0: ^3.4.0
  flatted@<=3.4.1: ^3.4.2
  js-yaml@<3.14.2: ^3.14.2
  js-yaml@<=4.1.1: ^4.1.2
  js-yaml@>=4.0.0 <4.1.1: ^4.1.1
  'micromatch@<4.0.8': '4.0.8'
  minimatch@<3.1.3: ^3.1.3
  minimatch@<3.1.4: ^3.1.4
  minimatch@>=9.0.0 <9.0.6: ^9.0.6
  minimatch@>=9.0.0 <9.0.7: ^9.0.7
  picomatch@<2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  'semver@<6.3.1': '6.3.1'
  tmp@<0.2.6: ^0.2.6
  tmp@<=0.2.3: ^0.2.4
  uuid@<11.1.1: ^11.1.1
  ws@>=7.0.0 <7.5.11: ^7.5.11
  ws@>=8.0.0 <8.20.1: ^8.20.1
  ws@>=8.0.0 <8.21.0: ^8.21.0
